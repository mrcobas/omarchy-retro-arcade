      - uses: actions/checkout@v4
      - name: Qualify actual bootstrap downloader clients
        if: github.event_name != 'push'
        timeout-minutes: 5
        run: python3 .github/scripts/ci-bootstrap-clients.py

      - name: Build the complete package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && packaging/build-arch.sh"
      - name: Install and verify
        run: |
          pacman -U --noconfirm dist/arch/*.pkg.tar.zst
          omarchy-retro-arcade --version
          test "$(pacman -Ql omarchy-retro-arcade | grep -c '/usr/share/applications/.*\.desktop$')" = 1
          su builder -c "cd '$GITHUB_WORKSPACE' && xvfb-run -a -s '-screen 0 1440x1100x24' env LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy python3 scripts/native-check.py /usr/bin/omarchy-retro-arcade"
          su builder -c "cd '$GITHUB_WORKSPACE' && xvfb-run -a -s '-screen 0 1440x1100x24' env LIBGL_ALWAYS_SOFTWARE=1 python3 scripts/native-blast.py /usr/bin/omarchy-retro-arcade"
          su builder -c 'xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 XDG_STATE_HOME=/tmp/arcade-upgrade omarchy-retro-arcade --game solitaire --screenshot /tmp/arcade-before.png'
          cp /tmp/arcade-upgrade/omarchy-solitaire/session.json /tmp/arcade-original.json
          pacman -U --noconfirm dist/arch/*.pkg.tar.zst
          cmp /tmp/arcade-original.json /tmp/arcade-upgrade/omarchy-solitaire/session.json
          su builder -c 'xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 XDG_STATE_HOME=/tmp/arcade-upgrade omarchy-retro-arcade --game solitaire --screenshot /tmp/arcade-after.png'
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/arch/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: corresponding-source-and-engine
          path: dist/arch/sources/
