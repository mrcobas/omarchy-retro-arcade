name: Arcade build and package
on: [push, pull_request]
permissions:
  contents: read
# JavaScript actions use the filtered OpenSSL store prepared before checkout.
env:
  NODE_OPTIONS: --use-openssl-ca

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare scoped CI certificate trust before actions
        shell: bash
        run: |
          python3 - <<'CI_TRUST_PY'
          import base64, concurrent.futures, hashlib, json, os, pathlib, socket, ssl, subprocess, sys
          bad = {'86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b', 'd7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4'}
          keys = ['SSL_CERT_FILE', 'SSL_CERT_DIR', 'CURL_CA_BUNDLE', 'REQUESTS_CA_BUNDLE', 'GIT_SSL_CAINFO', 'PIP_CERT', 'NODE_OPTIONS', 'CURL_HOME', 'GIT_SSL_CAPATH', 'CARGO_HTTP_CAINFO']
          raw_env = {k:v for k,v in os.environ.items() if k not in keys}
          for k in keys:
              os.environ.pop(k, None)
          paths = ssl.get_default_verify_paths()
          raw = ssl.create_default_context()
          roots = {hashlib.sha256(c).hexdigest():c for c in raw.get_ca_certs(binary_form=True)}
          assert len(roots) >= 80, 'Unexpectedly small runner CA store; refusing replacement'
          probe = os.environ.get('CI_TRUST_PROBE') == '1'
          hosts = [f'{a}-{b}-emudhra.we-have-a-problem.com' for b in ['g3b','g3c','g3b-aaa','g3c-aaa'] for a in ['dv','ov','ev']] + ['dv-g3b-noct-emudhra.we-have-a-problem.com','dv-g3b-aaa-noct-emudhra.we-have-a-problem.com']
          controls = ['github.com','registry.npmjs.org','pypi.org','files.pythonhosted.org']
          def tls(host, context):
              try:
                  with socket.create_connection((host,443), timeout=10) as s:
                      with context.wrap_socket(s,server_hostname=host):
                          return {'host':host,'result':'accepted_tls'}
              except ssl.SSLCertVerificationError:
                  return {'host':host,'result':'rejected_certificate'}
              except Exception as e:
                  return {'host':host,'result':'transport_error','error_type':type(e).__name__}
          def python_probes(context):
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  return list(pool.map(lambda h:tls(h,context),hosts+controls))
          node_code = r"""
          const tls=require('node:tls');
          const hosts=JSON.parse(process.argv[1]);
          Promise.all(hosts.map(host=>new Promise(resolve=>{
           let done=false; const end=result=>{if(!done){done=true;resolve({host,result});s.destroy();}};
           const s=tls.connect({host,port:443,servername:host,rejectUnauthorized:true},()=>end('accepted_tls'));
           s.setTimeout(10000,()=>end('transport_error'));
           s.on('error',e=>end(/CERT|ISSUER|VERIFY|SELF_SIGNED/.test(e.code||'')?'rejected_certificate':'transport_error'));
          }))).then(rows=>console.log(JSON.stringify({node:process.version,openssl:process.versions.openssl,executable:process.execPath,rows})));
          """
          # Find the actual JavaScript action runtime, rather than trusting the action.yml label.
          node_paths = []
          for root in ['/home/runner/runners','/Users/runner/runners']:
              node_paths += sorted(pathlib.Path(root).glob('*/externals/node24/bin/node'))
          node_paths += [pathlib.Path('/__e/node24/bin/node'),pathlib.Path('/home/runner/actions-runner/externals/node24/bin/node')]
          worker_executables=[]
          for proc in pathlib.Path('/proc').glob('[0-9]*'):
              try:
                  if (proc/'comm').read_text().strip() in ('Runner.Worker','Runner.Listener'):
                      executable=(proc/'exe').resolve()
                      worker_executables.append(str(executable))
                      node_paths.insert(0,executable.parent.parent/'externals/node24/bin/node')
              except (OSError,PermissionError):
                  pass
          try:
              for line in subprocess.check_output(['ps','-axo','comm='], text=True).splitlines():
                  p=pathlib.Path(line.strip())
                  if p.name == 'Runner.Worker' and p.is_absolute():
                      node_paths.insert(0,p.parent.parent/'externals/node24/bin/node')
          except (OSError,subprocess.CalledProcessError):
              pass
          node = next((p for p in node_paths if p.is_file()),None)
          def node_probes(env):
              if node is None:
                  print(json.dumps({'runner_worker_executables':worker_executables,'node_candidates':[str(p) for p in node_paths]},sort_keys=True),flush=True)
              assert node is not None, 'Actual action node24 binary was not found' 
              return json.loads(subprocess.check_output([str(node),'-e',node_code,json.dumps(hosts+controls)],env=env,text=True,timeout=35))
          def curl_probes(env):
              def one(h):
                  r=subprocess.run(['curl','--noproxy','*','--silent','--show-error','--head','--output',os.devnull,'--connect-timeout','8','--max-time','12','https://'+h+'/'],env=env,capture_output=True,text=True,timeout=15)
                  return {'host':h,'result':'accepted_tls' if r.returncode==0 else ('rejected_certificate' if r.returncode==60 else 'transport_error'),'exit':r.returncode}
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  return list(pool.map(one,hosts+controls))
          def gate(rows):
              assert len(rows)==18
              assert all(r['result']=='rejected_certificate' for r in rows if r['host'] in hosts), 'Affected chain accepted or network inconclusive'
              assert all(r['result']=='accepted_tls' for r in rows if r['host'] in controls), 'Normal TLS control failed'
          if probe:
              print(json.dumps({'phase':'raw_runner_before_scoped_changes','python':sys.version.split()[0],'openssl':ssl.OPENSSL_VERSION,'ca_paths':list(paths),'python_tls':python_probes(raw),'action_node':node_probes(raw_env),'curl_tls':curl_probes(raw_env)},sort_keys=True),flush=True)
          # Remove only the two public trust anchors covering the compromised emSign chains.
          # Preserve every other anchor. An empty directory prevents OpenSSL capath fallback.
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'cobas-ci-trust'
          out.mkdir(mode=0o755,parents=True,exist_ok=True)
          os.chmod(out,0o755)
          empty = out/'empty'; empty.mkdir(exist_ok=True); os.chmod(empty,0o755)
          bundle = out/'roots.pem'
          kept = {h:c for h,c in roots.items() if h not in bad}
          bundle.write_text(''.join(ssl.DER_cert_to_PEM_cert(c) for c in kept.values()))
          os.chmod(bundle,0o644)
          assert set(roots)-set(kept) <= bad and not (set(kept)&bad)
          settings = {k:str(bundle) for k in ['SSL_CERT_FILE','CURL_CA_BUNDLE','REQUESTS_CA_BUNDLE','GIT_SSL_CAINFO','PIP_CERT']}
          settings['SSL_CERT_DIR']=str(empty)
          settings['GIT_SSL_CAPATH']=str(empty)
          settings['CARGO_HTTP_CAINFO']=str(bundle)
          # libcurl's compiled default CApath can override SSL_CERT_DIR. A job-scoped
          # curlrc closes that fallback for normal curl calls; --disable callers are separate.
          (out/'.curlrc').write_text('cacert = '+json.dumps(str(bundle))+'\ncapath = '+json.dumps(str(empty))+'\n')
          settings['CURL_HOME']=str(out)
          settings['HOMEBREW_CURLRC']=str(out/'.curlrc')
          protected_env={**raw_env,**settings,'NODE_OPTIONS':'--use-openssl-ca'}
          protected=ssl.create_default_context(cafile=str(bundle),capath=str(empty))
          print(json.dumps({'phase':'scoped_ca_prepared','source_anchors':len(roots),'kept_anchors':len(kept),'removed_public_sha256':sorted(set(roots)-set(kept)),'bundle_sha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),'actual_action_node':str(node) if node else None,'provider_boundary':'Runner .NET action downloads and host container pulls happen outside this shell; this does not attest them.'},sort_keys=True),flush=True)
          # Preserve curl verification even when an owned caller passes --disable/-q.
          # Flags precede the caller's -- URL separator; no credentials are put in this wrapper.
          import shutil,shlex
          real_curl=shutil.which('curl');assert real_curl and pathlib.Path(real_curl).resolve().is_file()
          bin_dir=out/'bin';bin_dir.mkdir(mode=0o755,exist_ok=True);os.chmod(bin_dir,0o755)
          wrapper=bin_dir/'curl'
          wrapper.write_text('#!/bin/sh\nexec '+shlex.quote(real_curl)+' --cacert '+shlex.quote(str(bundle))+' --capath '+shlex.quote(str(empty))+' "$@"\n')
          os.chmod(wrapper,0o755)
          with open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(bin_dir)+'\n')
          protected_env['PATH']=str(bin_dir)+os.pathsep+protected_env['PATH']
          # Arch makepkg uses an absolute /usr/bin/curl agent. Preserve its full configuration
          # and agent flags while replacing only the curl executable in a per-job config.
          makepkg=pathlib.Path('/etc/makepkg.conf')
          if makepkg.is_file():
              config=out/'makepkg.conf'
              text=makepkg.read_text()
              assert '/usr/bin/curl' in text, 'Unexpected makepkg agent configuration'
              config.write_text(text.replace('/usr/bin/curl',str(wrapper)))
              os.chmod(config,0o644)
              settings['MAKEPKG_CONF']=str(config)
          if probe:
              py=python_probes(protected); nd=node_probes(protected_env); cu=curl_probes(protected_env)
              print(json.dumps({'phase':'scoped_runtime_acceptance','python_tls':py,'action_node':nd,'curl_tls':cu},sort_keys=True),flush=True)
              gate(py); gate(nd['rows']); gate(cu)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in settings.items():
                  f.write(f'{k}={v}\n')
          # NODE_OPTIONS must be set directly in workflow env; GitHub forbids setting it via GITHUB_ENV.
          CI_TRUST_PY

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Qualify actual bootstrap downloader clients
        if: github.event_name != 'push'
        timeout-minutes: 5
        run: python3 .github/scripts/ci-bootstrap-clients.py

      - uses: Swatinem/rust-cache@v2
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxtst6 xvfb stockfish desktop-file-utils python3-pil
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: REQUIRE_STOCKFISH=1 cargo test --workspace --locked --all-targets
      - run: scripts/build.sh
      - run: ctest --test-dir build/pinball --output-on-failure -R 'theme-palette|theme-path|authored-upstream-table'
      - run: desktop-file-validate packaging/omarchy-retro-arcade.desktop
      - name: Render every game and collection layout
        run: |
          xvfb-run -a -s '-screen 0 1440x1100x24' env LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy python3 scripts/polish-renders.py target/release/omarchy-retro-arcade /tmp/arcade-polish/dark dark
          xvfb-run -a -s '-screen 0 1440x1100x24' env LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy python3 scripts/polish-renders.py target/release/omarchy-retro-arcade /tmp/arcade-polish/compact compact
          xvfb-run -a -s '-screen 0 1440x1100x24' env LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy python3 scripts/polish-renders.py target/release/omarchy-retro-arcade /tmp/arcade-polish/light light
          xvfb-run -a -s '-screen 0 2400x1900x24' env LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy python3 scripts/polish-renders.py target/release/omarchy-retro-arcade /tmp/arcade-polish/200 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish-review
          path: /tmp/arcade-polish/
      - name: One window, nine games, existing saves
        run: xvfb-run -a -s '-screen 0 1440x1100x24' env LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy python3 scripts/native-check.py target/release/omarchy-retro-arcade
      - name: Stack keyboard, pause, focus and saves
        run: xvfb-run -a -s '-screen 0 2400x1900x24' env LIBGL_ALWAYS_SOFTWARE=1 python3 scripts/native-stack.py target/release/omarchy-retro-arcade /tmp/arcade-renders
      - name: Snake native controls, saves and layouts
        run: xvfb-run -a -s '-screen 0 2400x1800x24' env LIBGL_ALWAYS_SOFTWARE=1 python3 scripts/native-snake.py target/release/omarchy-retro-arcade /tmp/arcade-renders/snake
      - name: Blast solo, local match and lifecycle
        run: xvfb-run -a -s '-screen 0 1440x1100x24' env LIBGL_ALWAYS_SOFTWARE=1 python3 scripts/native-blast.py target/release/omarchy-retro-arcade /tmp/arcade-renders/blast
      - name: Capture the actual app
        run: |
          mkdir -p /tmp/arcade-renders
          for game in chess solitaire scram invaders pinball stack snake bubble blast; do
            xvfb-run -a -s '-screen 0 1440x1100x24' env LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy XDG_STATE_HOME=/tmp/arcade-$game/state XDG_DATA_HOME=/tmp/arcade-$game/data XDG_CONFIG_HOME=/tmp/arcade-$game/config target/release/omarchy-retro-arcade --game "$game" --screenshot "/tmp/arcade-renders/$game.png"
          done
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 target/release/omarchy-retro-arcade --compact --screenshot /tmp/arcade-renders/shelf-compact.png
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: /tmp/arcade-renders/
  arch:
