          assert versions, 'No actual bootstrap clients found'
          assert all(r['result']==('accepted_tls' if 'positive_provider' in r else 'rejected_certificate') for r in rows), 'Bootstrap downloader TLS acceptance is incomplete'
          CI_ARCH_RUST_PY
